name: "Сообщение об ошибке"
description: "Шаблон для отчета о дефектах"
title: "[Ошибка]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## Спасибо, что помогаете нам стать лучше!
        Пожалуйста, заполните форму ниже, чтобы мы могли воспроизвести и исправить проблему.

  - type: textarea
    id: description
    attributes:
      label: "Описание"
      description: "Подробно опишите, в чем заключается проблема."
      placeholder: "Например: при нажатии на кнопку 'Отправить' приложение вылетает..."
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: "Предусловия"
      description: "Опишите состояние системы или шаги, которые нужно выполнить перед воспроизведением."
      placeholder: "Например: Пользователь авторизован, открыта главная страница..."
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения"
      description: "Пошаговая инструкция для повторения ошибки."
      placeholder: |
        1. Перейти на страницу...
        2. Нажать на кнопку...
        3. Ввести данные...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемый результат"
      description: "Как должно работать приложение?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Фактический результат"
      description: "Как работает приложение сейчас?"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: "Скриншоты / Доп. материалы"
      description: "Прикрепите скриншоты, видео или логи (если есть)."
      placeholder: "Перетащите файлы сюда..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Приоритет"
      description: "Насколько срочно нужно исправить эту ошибку?"
      options:
        - Низкий (Low)
        - Средний (Medium)
        - Высокий (High)
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Серьезность"
      description: "Насколько сильно ошибка влияет на работу приложения?"
      options:
        - Незначительная (Minor)
        - Значительная (Major)
        - Критическая (Critical)
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: "Подтверждение"
      description: "Пожалуйста, подтвердите следующее:"
      options:
        - label: "Я ознакомился с уже существующими отчетами о дефектах и не нашел дубликатов."
          required: true
